---
# Le réseau local est en liste blanche : évite de se bannir soi-même
# pendant les tests d'administration.
fail2ban_ignoreip: "127.0.0.1/8 ::1 192.168.1.0/24"

# Convergence automatique limitée aux accès : une clé retirée du dépôt
# disparaît seule, sans interférer avec le développement des autres rôles.
admin_pull_enabled: false 
admin_pull_playbook: admins.yml
# Activer la maintenance (redémarrage les dimanches)
admin_maintenance_enabled: true
admin_check_enabled: true
check_timers_attendus: >-
  {{ (['ansible-pull.timer'] if admin_pull_enabled | default(false) else [])
     + (['maintenance.timer'] if admin_maintenance_enabled | default(false) else [])
     + (['check.timer'] if admin_check_enabled | default(false) else [])
     + ['apt-daily.timer', 'apt-daily-upgrade.timer'] }}

#configuration wireguard
wg_enabled: true
wg_private_key: "{{ vault_wg_rasb_private }}"
wg_route_lan: true
wg_lan_iface: eth0
wg_peers:
