---
# Le réseau local est en liste blanche : évite de se bannir soi-même
# pendant les tests d'administration.
fail2ban_ignoreip: "127.0.0.1/8 ::1 192.168.1.0/24"

# Convergence automatique limitée aux accès : une clé retirée du dépôt
# disparaît seule, sans interférer avec le développement des autres rôles.
admin_pull_enabled: false 
admin_pull_playbook: admins.yml
# Maintenance le dimanche à 03:00 (seules les VM redémarrent automatiquement)
admin_maintenance_enabled: true
admin_check_enabled: true
# Sauvegarde nocturne (02:00), avant la maintenance du dimanche (03:00)
admin_sauvegarde_enabled: true
# pve et pve2 peuvent être éteints la nuit : les tâches les réveillent puis les
# rééteignent (docs/reveil-pve.md)
admin_reveil_hyperviseur: true
check_timers_attendus: >-
  {{ (['ansible-pull.timer'] if admin_pull_enabled | default(false) else [])
     + (['maintenance.timer'] if admin_maintenance_enabled | default(false) else [])
     + (['check.timer'] if admin_check_enabled | default(false) else [])
     + (['sauvegarde.timer'] if admin_sauvegarde_enabled | default(false) else [])
     + ['apt-daily.timer', 'apt-daily-upgrade.timer'] }}
# Sauvegardes rapatriées ici, contrôlées par check.yml (moins de 26 h)
check_sauvegardes:
  - { nom: keycloak, dossier: "{{ sauvegarde_dir }}/idp", motif: "keycloak_*.dump" }

#configuration wireguard
wg_enabled: true
wg_private_key: "{{ vault_wg_rasb_private }}"
wg_route_lan: true
wg_lan_iface: eth0
# Les pairs sortent sur le réseau local avec l'adresse de rasb : sans cette
# liste, ils joindraient pve, pve2 et fw en direct, comme s'ils étaient rasb.
wg_lan_interdits:
  - "{{ pve_ip_lan }}"
  - "{{ pve2_ip_lan }}"
  - "{{ fw_ip_externe }}"
wg_peers: "{{ wg_peers_declares }}"
wg_services_lien: "{{ services_web_admin }}"
wg_dns_lien: "{{ passerelle_interne }}"

wg_relais:
  - vers: 10.99.0.100
    port: 8006
    commentaire: "interface web Proxmox"

# Lien d'administration wg1 vers fw : route vers le réseau interne des VM
wg_lien_enabled: true
wg_lien_adresse: "{{ lien_admin_rasb }}/30"
wg_lien_cle_privee: "{{ vault_wg_lien_rasb_private | default('') }}"
wg_lien_pair:
  nom: fw
  public_key: "{{ wg_lien_cle_publique_fw }}"
  allowed_ips: ["{{ lien_admin_fw }}/32", "{{ reseau_interne }}.0/24"]
  endpoint: "{{ fw_ip_externe }}:{{ lien_admin_port }}"
  keepalive: 25
