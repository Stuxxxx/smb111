---
# Comptes du SSO (Keycloak, realm smb111). Appliqués par :
#   ansible-playbook site.yml --limit idp --tags comptes
#
# DÉPÔT PUBLIC : uniquement des identifiants. Ni e-mail, ni nom complet, ni
# mot de passe. L'adresse e-mail de chaque compte est dans le vault
# (vault_keycloak_emails).
#
# Champs :
#   nom      identifiant de connexion, en minuscules            (obligatoire)
#   groupes  admins (gèrent les comptes) et/ou utilisateurs     (défaut : aucun)
#   actif    false = compte bloqué, mais conservé               (défaut : true)
#   state    absent = compte supprimé                           (défaut : present)
#
# Un nouveau compte reçoit une invitation par e-mail (valable 48 h) pour choisir
# son mot de passe et activer la double authentification.
# Renvoyer l'invitation : ajouter -e renvoyer=nom à la commande ci-dessus.

keycloak_utilisateurs:
  - { nom: sacha,  groupes: [admins] }
  - { nom: orfeo,  groupes: [admins] }
  - { nom: leo,    groupes: [admins] }
  - { nom: kilian, groupes: [admins] }
  - { nom: seeeb,  groupes: [admins] }
