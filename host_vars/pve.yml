# Les paquets Proxmox ne viennent pas d'une origine autorisée par
# unattended-upgrades (sécurité Debian uniquement) : ils sont mis à jour
# chaque dimanche par playbooks/maintenance.yml, sans redémarrage automatique
# de pve (redémarrage à la main, signalé par le bilan et par check.yml).

# Le tunnel est déjà authentifié par clé : ne pas s'y bannir soi-même
fail2ban_ignoreip: "127.0.0.1/8 ::1 10.99.0.0/24"

# Le compte de service n'est pas dans la liste du dépôt
check_comptes_autorises: "{{ ['root', 'ansible'] + (admins | rejectattr('state', 'defined') | map(attribute='name') | list) }}"
