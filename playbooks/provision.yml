---
# Création des VM du SI sur l'hyperviseur Proxmox, par clonage du template
# cloud-init. Exécuté depuis la machine d'administration, via l'API.
#
#   ansible-playbook playbooks/provision.yml
#   ansible-playbook playbooks/provision.yml -e cible=fw
#   ansible-playbook playbooks/provision.yml -e demarrer=false
#
# Prérequis : template debian-13-template (vmid 9000), jeton d'API dans le vault,
# tunnel wg0 actif vers l'hyperviseur.

# Les VM sont clonées sur le premier nœud du cluster (pve), qui porte le
# template. Celles qui vont sur un autre nœud (champ node de vms.yml, ex. sup sur
# pve2) y sont ensuite migrées, arrêtées : local-lvm n'est pas partagé.
- name: Créer les VM sur Proxmox
  hosts: proxmox[0]
  gather_facts: false
  connection: local

  vars:
    ansible_python_interpreter: /opt/pipx/venvs/ansible/bin/python
    demarrer: true
    cible: ""
    vms_cibles: >-
      {{ vms | selectattr('name', 'equalto', cible) | list if cible else vms }}
    # VM branchées sur le réseau local (vmbr0) plutôt que derrière fw
    vms_locales: "{{ vms_cibles | selectattr('reseau', 'defined') | selectattr('reseau', 'equalto', 'local') | list }}"

    # Connexion à l'API. proxmox_nic refuse le paramètre node : il utilise
    # pve_api seul ; les autres modules utilisent pve (pve_api + node).
    pve_api: &pve_api
      api_host: "{{ pve_api_host }}"
      api_user: "{{ pve_api_user }}"
      api_token_id: "{{ pve_api_token_id }}"
      api_token_secret: "{{ pve_api_token_secret }}"
      validate_certs: false

    pve: &pve
      <<: *pve_api
      node: "{{ pve_node }}"

  tasks:
    - name: Vérifier que la mémoire des VM tient dans chaque nœud
      ansible.builtin.assert:
        that: memoire_noeud | int <= hostvars[item].pve_memoire_max_vms | int
        fail_msg: >-
          Les VM de {{ item }} demandent {{ memoire_noeud }} Mio, plus que son
          pve_memoire_max_vms ({{ hostvars[item].pve_memoire_max_vms }} Mio).
        quiet: true
      vars:
        memoire_noeud: >-
          {{ vms | selectattr('node', 'defined') | selectattr('node', 'equalto', item) | map(attribute='memory') | sum
             + (vms | rejectattr('node', 'defined') | map(attribute='memory') | sum if item == pve_node else 0) }}
      loop: "{{ groups['proxmox'] }}"

    - name: Vérifier que le template existe
      community.proxmox.proxmox_vm_info:
        <<: *pve
        name: "{{ pve_template }}"
      register: template_info
      failed_when: template_info.proxmox_vms | length == 0

    - name: Cloner le template
      community.proxmox.proxmox_kvm:
        <<: *pve
        clone: "{{ pve_template }}"
        name: "{{ item.name }}"
        newid: "{{ item.vmid }}"
        storage: "{{ pve_storage }}"
        full: true
        timeout: 300
      loop: "{{ vms_cibles }}"
      loop_control:
        label: "{{ item.name }} ({{ item.vmid }})"

    - name: Nœud actuel des VM
      community.proxmox.proxmox_vm_info:
        <<: *pve_api
        vmid: "{{ item.vmid }}"
      register: vm_info
      loop: "{{ vms_cibles | selectattr('node', 'defined') | list }}"
      loop_control:
        label: "{{ item.name }}"

    # Migration hors ligne : le disque est recopié vers le local-lvm du nœud cible
    - name: Migrer les VM vers leur nœud
      ansible.builtin.command: "qm migrate {{ item.item.vmid }} {{ item.item.node }}"
      delegate_to: "{{ item.proxmox_vms[0].node }}"
      connection: ssh
      become: true
      vars:
        ansible_python_interpreter: /usr/bin/python3
      when:
        - item.proxmox_vms | length > 0      # absente en --check avant le clonage
        - item.proxmox_vms[0].node != item.item.node
      loop: "{{ vm_info.results }}"
      loop_control:
        label: "{{ item.item.name }} → {{ item.item.node }}"

    - name: Dimensionner CPU et mémoire
      community.proxmox.proxmox_kvm:
        <<: *pve_api
        node: "{{ item.node | default(pve_node) }}"
        vmid: "{{ item.vmid }}"
        cores: "{{ item.cores }}"
        memory: "{{ item.memory }}"
        onboot: true
        update: true
      loop: "{{ vms_cibles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Taille actuelle du disque
      ansible.builtin.command: "qm config {{ item.vmid }}"
      delegate_to: "{{ item.node | default(pve_node) }}"
      connection: ssh
      become: true
      vars:
        ansible_python_interpreter: /usr/bin/python3
      register: qm_conf
      changed_when: false
      loop: "{{ vms_cibles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Agrandir le disque si nécessaire
      ansible.builtin.command: "qm resize {{ item.item.vmid }} scsi0 {{ item.item.disk }}G"
      delegate_to: "{{ item.item.node | default(pve_node) }}"
      connection: ssh
      become: true
      vars:
        ansible_python_interpreter: /usr/bin/python3
      when: "'size=' ~ item.item.disk ~ 'G' not in item.stdout"
      loop: "{{ qm_conf.results }}"
      loop_control:
        label: "{{ item.item.name }} → {{ item.item.disk }} Go"

    - name: Interface externe du pare-feu
      community.proxmox.proxmox_nic:
        <<: *pve_api
        vmid: "{{ item.vmid }}"
        interface: net1
        bridge: "{{ pve_bridge_externe }}"
        state: present
      loop: "{{ vms_cibles | selectattr('externe', 'defined') | selectattr('externe') | list }}"
      loop_control:
        label: "{{ item.name }} → {{ pve_bridge_externe }}"

    - name: Interface unique sur le réseau local
      community.proxmox.proxmox_nic:
        <<: *pve_api
        vmid: "{{ item.vmid }}"
        interface: net0
        bridge: "{{ pve_bridge_externe }}"
        state: present
      loop: "{{ vms_locales }}"
      loop_control:
        label: "{{ item.name }} → {{ pve_bridge_externe }}"

    - name: Injecter la configuration cloud-init
      community.proxmox.proxmox_kvm:
        <<: *pve_api
        node: "{{ item.node | default(pve_node) }}"
        vmid: "{{ item.vmid }}"
        # Pas de cipassword : le compte ansible n'a pas de mot de passe
        # (cloud-init le verrouille), l'accès se fait uniquement par clé.
        ciuser: ansible
        sshkeys: "{{ lookup('ansible.builtin.file', '/etc/ansible/smb111.pub') }}"
        # fw et les VM du réseau local ne dépendent pas du DNS de fw
        nameservers: "{{ '1.1.1.1' if item.name == 'fw' or item in vms_locales else passerelle_interne }}"
        ipconfig:
          ipconfig0: >-
            ip={{ item.ip }}/24{{ ',gw=' ~ passerelle_externe if item in vms_locales
                                  else ',gw=' ~ passerelle_interne if item.name != 'fw' else '' }}
          ipconfig1: "{{ 'ip=' ~ fw_ip_externe ~ '/24,gw=' ~ passerelle_externe if item.name == 'fw' else '' }}"
        update: true
      loop: "{{ vms_cibles }}"
      loop_control:
        label: "{{ item.name }} → {{ item.ip }}"

    - name: Démarrer les VM
      community.proxmox.proxmox_kvm:
        <<: *pve_api
        node: "{{ item.node | default(pve_node) }}"
        vmid: "{{ item.vmid }}"
        state: started
      loop: "{{ vms_cibles }}"
      loop_control:
        label: "{{ item.name }}"
      when: demarrer | bool

    - name: Attendre que SSH réponde
      ansible.builtin.wait_for:
        host: "{{ item.ip }}"
        port: 22
        timeout: 300
        delay: 10
      loop: "{{ vms_cibles }}"
      loop_control:
        label: "{{ item.name }} ({{ item.ip }})"
      when:
        - demarrer | bool
        - item.name != 'fw'      # fw est la passerelle : joignable une fois configuré

    - name: Récapitulatif
      ansible.builtin.debug:
        msg: >-
          {{ vms_cibles | length }} VM traitée(s) :
          {{ vms_cibles | map(attribute='name') | join(', ') }}
