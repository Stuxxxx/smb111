---
# Création de la PKI du SI, depuis rasb, dans son clone du dépôt.
#
#   ansible-playbook playbooks/pki-init.yml
#   ansible-playbook playbooks/pki-init.yml -e regenerer=intermediaire
#   ansible-playbook playbooks/pki-init.yml -e regenerer=tout
#
# Produit :
#   pki/racine.crt, pki/intermediaire.crt   certificats publics, à commiter
#   pki/intermediaire.key                   clé chiffrée par ansible-vault, à commiter
#   pki_racine_cle                          clé de la racine, chiffrée, HORS du dépôt :
#                                           à rapatrier sur son poste, puis à effacer de rasb
#
# Une PKI existante n'est jamais écrasée sans le demander : la remplacer invalide
# tous les certificats émis. regenerer=intermediaire garde la racine (sa clé est
# alors demandée), regenerer=tout repart de zéro (racine à réinstaller partout).
# Les clés en clair ne vivent que dans un dossier temporaire, supprimé à la fin.

- name: Créer la PKI du SI
  hosts: admin
  connection: local
  gather_facts: false
  become: false

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    regenerer: ""
    # Clé de la racine, chiffrée : écrite ici à la création, lue ici pour signer un
    # nouvel intermédiaire (la renvoyer alors ici depuis son poste, docs/pki.md)
    pki_racine_cle: "{{ lookup('ansible.builtin.env', 'HOME') }}/pki-racine/racine.key"
    # Contrainte de noms commune aux deux CA (RFC 5280, critique)
    pki_contrainte_noms:
      - "DNS:{{ pki_domaine }}"
      - "IP:{{ pki_reseau_ip }}"

  tasks:
    - name: Valeur de regenerer
      ansible.builtin.assert:
        that: regenerer in ['', 'intermediaire', 'tout']
        fail_msg: "regenerer accepte : intermediaire, tout"
        quiet: true

    - name: Certificats déjà présents dans pki/
      ansible.builtin.stat:
        path: "{{ pki_dir }}/{{ item }}.crt"
      loop: [racine, intermediaire]
      register: pki_existant

    - name: Clé de la racine hors du dépôt
      ansible.builtin.stat:
        path: "{{ pki_racine_cle }}"
      register: pki_cle_racine

    - name: Ce qu'il reste à créer
      ansible.builtin.set_fact:
        creer_racine: "{{ not pki_existant.results[0].stat.exists or regenerer == 'tout' }}"
        creer_intermediaire: >-
          {{ not pki_existant.results[0].stat.exists or regenerer in ['tout', 'intermediaire']
             or not pki_existant.results[1].stat.exists }}

    - name: Rien à faire
      ansible.builtin.meta: end_play
      when: not creer_racine and not creer_intermediaire

    - name: La clé de la racine est disponible pour signer l'intermédiaire
      ansible.builtin.assert:
        that: pki_cle_racine.stat.exists
        fail_msg: >-
          Clé de la racine introuvable ({{ pki_racine_cle }}). La renvoyer depuis son
          poste (docs/pki.md, étape 2), ou indiquer son emplacement : -e pki_racine_cle=...
        quiet: true
      when: not creer_racine

    - name: Pas d'écrasement involontaire d'une clé de racine
      ansible.builtin.assert:
        that: not pki_cle_racine.stat.exists or regenerer == 'tout'
        fail_msg: >-
          {{ pki_racine_cle }} existe déjà alors que pki/racine.crt est absent.
          Pour repartir de zéro : -e regenerer=tout
        quiet: true
      when: creer_racine

    - name: Répertoire pki/
      ansible.builtin.file:
        path: "{{ pki_dir }}"
        state: directory
        mode: "0755"

    - name: Dossier temporaire pour les clés en clair
      ansible.builtin.tempfile:
        state: directory
        prefix: pki-
      register: tmp

    - name: Création des CA
      block:
        # --- Racine -------------------------------------------------------------
        - name: Racine existante, déchiffrée le temps de signer l'intermédiaire
          ansible.builtin.copy:
            content: "{{ lookup('ansible.builtin.unvault', pki_racine_cle) }}"
            dest: "{{ tmp.path }}/racine.key"
            mode: "0600"
          no_log: true
          when: not creer_racine

        - name: Création de la racine
          when: creer_racine
          block:
            - name: Clé privée de la racine
              community.crypto.openssl_privatekey:
                path: "{{ tmp.path }}/racine.key"
                type: ECC
                curve: secp384r1
                mode: "0600"

            - name: Demande de la racine
              community.crypto.openssl_csr_pipe:
                privatekey_path: "{{ tmp.path }}/racine.key"
                common_name: "{{ pki_racine_cn }}"
                organization_name: "{{ pki_organisation }}"
                use_common_name_for_san: false
                basic_constraints: ["CA:TRUE"]
                basic_constraints_critical: true
                key_usage: [keyCertSign, cRLSign]
                key_usage_critical: true
                name_constraints_permitted: "{{ pki_contrainte_noms }}"
                name_constraints_critical: true
              register: csr_racine

            - name: Certificat autosigné de la racine
              community.crypto.x509_certificate:
                path: "{{ pki_dir }}/racine.crt"
                csr_content: "{{ csr_racine.csr }}"
                privatekey_path: "{{ tmp.path }}/racine.key"
                provider: selfsigned
                selfsigned_not_after: "{{ pki_racine_duree }}"
                force: true
                mode: "0644"

        # --- Intermédiaire --------------------------------------------------------
        - name: Création de l'intermédiaire
          when: creer_intermediaire
          block:
            - name: Clé privée de l'intermédiaire
              community.crypto.openssl_privatekey:
                path: "{{ tmp.path }}/intermediaire.key"
                type: ECC
                curve: secp384r1
                mode: "0600"

            # pathlen:0 : l'intermédiaire signe des services, jamais une autre CA
            - name: Demande de l'intermédiaire
              community.crypto.openssl_csr_pipe:
                privatekey_path: "{{ tmp.path }}/intermediaire.key"
                common_name: "{{ pki_intermediaire_cn }}"
                organization_name: "{{ pki_organisation }}"
                use_common_name_for_san: false
                basic_constraints: ["CA:TRUE", "pathlen:0"]
                basic_constraints_critical: true
                key_usage: [keyCertSign, cRLSign]
                key_usage_critical: true
                name_constraints_permitted: "{{ pki_contrainte_noms }}"
                name_constraints_critical: true
              register: csr_intermediaire

            - name: Certificat de l'intermédiaire, signé par la racine
              community.crypto.x509_certificate:
                path: "{{ pki_dir }}/intermediaire.crt"
                csr_content: "{{ csr_intermediaire.csr }}"
                privatekey_path: "{{ tmp.path }}/intermediaire.key"
                provider: ownca
                ownca_path: "{{ pki_dir }}/racine.crt"
                ownca_privatekey_path: "{{ tmp.path }}/racine.key"
                ownca_not_after: "{{ pki_intermediaire_duree }}"
                force: true
                mode: "0644"

        # --- Chiffrement des clés -------------------------------------------------
        # ansible-vault lit le mot de passe via ansible.cfg (vault_password_file)
        - name: Ancienne clé chiffrée de l'intermédiaire retirée
          ansible.builtin.file:
            path: "{{ pki_dir }}/intermediaire.key"
            state: absent
          when: creer_intermediaire

        - name: Clé de l'intermédiaire chiffrée dans pki/
          ansible.builtin.command:
            cmd: "ansible-vault encrypt --output {{ pki_dir }}/intermediaire.key {{ tmp.path }}/intermediaire.key"
            chdir: "{{ inventory_dir }}"
          changed_when: true
          when: creer_intermediaire

        - name: Répertoire de la clé de la racine, hors du dépôt
          ansible.builtin.file:
            path: "{{ pki_racine_cle | dirname }}"
            state: directory
            mode: "0700"
          when: creer_racine

        - name: Ancienne clé de la racine retirée
          ansible.builtin.file:
            path: "{{ pki_racine_cle }}"
            state: absent
          when: creer_racine

        - name: Clé de la racine chiffrée, hors du dépôt
          ansible.builtin.command:
            cmd: "ansible-vault encrypt --output {{ pki_racine_cle }} {{ tmp.path }}/racine.key"
            chdir: "{{ inventory_dir }}"
          changed_when: true
          when: creer_racine

      always:
        - name: Suppression des clés en clair
          ansible.builtin.file:
            path: "{{ tmp.path }}"
            state: absent

    # Première PKI : la clé de la racine était versionnée. Elle n'a plus rien à y faire.
    - name: Aucune clé de racine dans le dépôt
      ansible.builtin.file:
        path: "{{ pki_dir }}/racine.key"
        state: absent

    - name: Empreinte de la racine
      community.crypto.x509_certificate_info:
        path: "{{ pki_dir }}/racine.crt"
      register: pki_racine_info

    - name: Suite
      ansible.builtin.debug:
        msg:
          - "PKI prête dans {{ pki_dir }}. Vérifier :"
          - "  openssl verify -CAfile pki/racine.crt pki/intermediaire.crt"
          - "  openssl x509 -in pki/intermediaire.crt -noout -ext nameConstraints"
          - "  head -1 pki/intermediaire.key          # doit afficher $ANSIBLE_VAULT;1.1;AES256"
          - "Empreinte SHA-256 de la racine, à reporter dans docs/pki.md :"
          - "  {{ pki_racine_info.fingerprints.sha256 | upper }}"
          - "{{ ('Clé de la racine : ' ~ pki_racine_cle ~ ' -> la rapatrier sur son poste (scp rasb:pki-racine/racine.key .), puis : shred -u ' ~ pki_racine_cle) if creer_racine else '' }}"
          - "Commiter : git add -A pki/ docs/pki.md && git commit"
          - "Puis : ansible-playbook site.yml --tags pki,keycloak"
