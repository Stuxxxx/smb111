# Mise à jour complète du parc, une machine à la fois.
# Les nœuds Kubernetes sont vidés avant et remis en service après.
#
#   ansible-playbook playbooks/maintenance.yml
#   ansible-playbook playbooks/maintenance.yml --limit rasb
#   ansible-playbook playbooks/maintenance.yml -e maintenance_reboot=false

- name: Maintenance du parc
  hosts: all
  become: true
  serial: 1
  max_fail_percentage: 0

  vars:
    maintenance_reboot: true

  tasks:
    - name: Retirer le nœud du cluster (drain)
      ansible.builtin.command:
        cmd: >
          kubectl drain {{ inventory_hostname }}
          --ignore-daemonsets --delete-emptydir-data --timeout=300s
      delegate_to: "{{ groups['control_plane'] | first }}"
      when: inventory_hostname in groups.get('k3s', [])
      changed_when: true

    - name: Mise à jour complète
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
        autoremove: true
      register: apt_upgrade

    - name: Un redémarrage est-il nécessaire ?
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Redémarrer
      ansible.builtin.reboot:
        reboot_timeout: 600
      when:
        - reboot_required.stat.exists
        - maintenance_reboot | bool

    - name: Attendre que les services soient repartis
      ansible.builtin.service_facts:
      when: reboot_required.stat.exists

    - name: Remettre le nœud en service (uncordon)
      ansible.builtin.command:
        cmd: kubectl uncordon {{ inventory_hostname }}
      delegate_to: "{{ groups['control_plane'] | first }}"
      when: inventory_hostname in groups.get('k3s', [])
      changed_when: true

    - name: Journal de maintenance
      ansible.builtin.lineinfile:
        path: /var/log/maintenance.log
        line: >-
          {{ ansible_date_time.iso8601 }} maintenance appliquée,
          redémarrage {{ 'oui' if reboot_required.stat.exists else 'non' }}
        create: true
        owner: root
        group: root
        mode: "0644"