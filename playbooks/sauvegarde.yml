---
# Sauvegarde de l'état persistant du SI, rapatriée sur rasb (docs/sauvegarde.md).
# Aujourd'hui : la base de Keycloak (comptes, groupes, double authentification).
#
#   ansible-playbook playbooks/sauvegarde.yml
#
# Programmée chaque nuit par le timer sauvegarde.timer (rôle admin), avant la
# maintenance. Un bilan HTML part à chaque réussite (-e sauvegarde_notifier=true,
# posé par le timer), un échec prévient les admins par e-mail ; check.yml
# signale en plus toute sauvegarde de plus de 26 h.

- name: Sauvegarde de Keycloak
  hosts: idp
  become: true
  gather_facts: false

  vars:
    export_dossier_vm: /var/backups/keycloak
    dossier_rasb: "{{ sauvegarde_dir }}/{{ inventory_hostname }}"

  tasks:
    - name: Export et rapatriement
      ansible.builtin.import_tasks: taches/export-keycloak.yml

    # --- Conservation sur la VM : quelques jours, pour restaurer vite --------
    - name: Anciennes sauvegardes sur la VM
      ansible.builtin.find:
        paths: "{{ export_dossier_vm }}"
        patterns: "keycloak_*.dump"
        age: "{{ sauvegarde_retention_vm_jours }}d"
      register: anciennes_vm

    - name: Retirer les anciennes sauvegardes de la VM
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ anciennes_vm.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    # --- Conservation sur rasb : au-delà de la durée, sauf les plus récentes -
    - name: Sauvegardes présentes sur rasb
      ansible.builtin.find:
        paths: "{{ dossier_rasb }}"
        patterns: "keycloak_*.dump"
      register: sur_rasb
      delegate_to: localhost
      become: false

    - name: Retirer les sauvegardes expirées de rasb
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ expirees }}"
      loop_control:
        label: "{{ item.path | basename }}"
      delegate_to: localhost
      become: false
      vars:
        limite: "{{ now().timestamp() - (sauvegarde_retention_jours | int) * 86400 }}"
        a_garder: >-
          {{ (sur_rasb.files | sort(attribute='mtime', reverse=true))[:sauvegarde_conserver_min | int]
             | map(attribute='path') | list }}
        expirees: >-
          {{ sur_rasb.files | rejectattr('path', 'in', a_garder)
             | selectattr('mtime', 'lt', limite | float) | list }}

    # Les admins de Keycloak ont pu changer depuis la console : liste rafraîchie
    - name: Destinataires des notifications (admins de Keycloak)
      ansible.builtin.import_role:
        name: keycloak_comptes
        tasks_from: destinataires

    - name: Résumé
      ansible.builtin.debug:
        msg: >-
          Sauvegarde {{ export_fichier }} sur idp et dans {{ dossier_rasb }}
          ({{ sur_rasb.matched }} sauvegarde(s) sur rasb avant nettoyage).

    # --- Bilan envoyé aux administrateurs à chaque sauvegarde réussie -------
    # (un échec arrête le play avant : c'est notification-echec@ qui prévient)
    - name: Envoyer le bilan aux administrateurs
      when: sauvegarde_notifier | default(false) | bool
      delegate_to: localhost
      become: false
      run_once: true
      # La sauvegarde est faite : un e-mail qui ne part pas ne doit pas la marquer en échec
      ignore_errors: true
      block:
        - name: Sauvegardes conservées sur rasb
          ansible.builtin.find:
            paths: "{{ dossier_rasb }}"
            patterns: "keycloak_*.dump"
          register: conservees

        - name: Fichier temporaire pour la version HTML
          ansible.builtin.tempfile:
            suffix: .html
          register: bilan_html

        - name: Version HTML du bilan
          ansible.builtin.template:
            src: sauvegarde-bilan.html.j2
            dest: "{{ bilan_html.path }}"
            mode: "0600"
          vars:
            bilan_date: "{{ now(fmt='%d/%m/%Y · %H:%M') }}"
            bilan_conservees: "{{ conservees.files | sort(attribute='mtime', reverse=true) }}"
            bilan_taille: >-
              {{ (conservees.files | selectattr('path', 'search', export_fichier ~ '$')
                  | map(attribute='size') | first | default(0)) | int }}

        - name: Envoi
          ansible.builtin.command:
            argv:
              - "{{ admin_notifier | default('/usr/local/bin/smb111-notifier') }}"
              - --html
              - "{{ bilan_html.path }}"
              - "Sauvegarde réussie : Keycloak"
            # Version texte, pour les clients qui n'affichent pas le HTML
            stdin: |
              Sauvegarde de Keycloak réussie.
              Fichier : {{ dossier_rasb }}/{{ export_fichier }}
              Sauvegardes conservées sur rasb : {{ conservees.matched }}
          changed_when: false

      always:
        - name: Fichier temporaire retiré
          ansible.builtin.file:
            path: "{{ bilan_html.path }}"
            state: absent
          when: bilan_html.path is defined
