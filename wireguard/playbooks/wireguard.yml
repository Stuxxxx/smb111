---
# Tunnel WireGuard entre les hôtes du groupe [wireguard] et les clients externes.
#
#   ansible-playbook playbooks/wireguard.yml
#   ansible-playbook playbooks/wireguard.yml --limit rasb
#
# Inventaire :
#   [wireguard]
#   rasb  wg_address=10.66.0.1  wg_endpoint=monpi.duckdns.org
#   fw    wg_address=10.66.0.2
#
# group_vars/wireguard.yml :
#   wg_peers_externes:
#     - { nom: laptop, cle_publique: "…=", adresse: 10.66.0.10 }

- name: Tunnel WireGuard
  hosts: wireguard
  become: true
  gather_facts: false
  roles:
    - wireguard
