---
- name: Configuration commune à toutes les machines
  hosts: all
  become: true
  roles:
    - common

- name: Machine d'administration
  hosts: admin
  become: true
  roles:
    - admin
    - role: wireguard
      tags: [wireguard]
    - role: wg_lien
      tags: [wg1]

- name: Hyperviseur
  hosts: proxmox
  become: true
  roles:
    - role: pve_firewall
      tags: [pve_firewall]
    - role: wol
      tags: [wol]

- name: Pare-feu du SI
  hosts: pare_feu
  become: true
  roles:
    - compte_ansible
    - role: fw
      tags: [fw]
    - role: wg_lien
      tags: [fw, wg1]
    - role: relais_mail
      tags: [fw, mail]

- name: VM du réseau interne
  hosts: interne
  become: true
  roles:
    - compte_ansible

- name: Fournisseur d'identité (SSO)
  hosts: idp
  become: true
  roles:
    - role: keycloak
      tags: [keycloak]
    - role: keycloak_comptes
      tags: [keycloak, comptes]

- name: Gestion des administrateurs
  import_playbook: admins.yml
