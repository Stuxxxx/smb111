[admin]
rasb ansible_connection=local ansible_user=sacha

# Cluster Proxmox : pve porte les VM, pve2 (portable) le rejoint
# (docs/cluster-proxmox.md). pve2 est joint par le réseau local depuis rasb.
[proxmox]
pve ansible_host=10.99.0.100 ansible_user=ansible
pve2 ansible_host=192.168.1.181 ansible_user=ansible

# Pare-feu du SI, joint par son interface externe tant que wg1 n'existe pas
[pare_feu]
fw ansible_host=192.168.1.70 ansible_user=ansible

# VM du réseau interne, jointes par wg1 (ajoutées au fur et à mesure)
[interne]
idp ansible_host=10.10.0.5

# Supervision, sur pve2 et le réseau local (docs/supervision.md) : jointe en
# direct par rasb, comme fw
[supervision]
sup ansible_host=192.168.1.71
