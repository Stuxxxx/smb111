[admin]
rasb ansible_connection=local ansible_user=sacha

# Cluster Proxmox : pve porte les VM, pve2 (portable) le rejoint
# (wiki : Cluster-Proxmox). pve2 est joint par le réseau local depuis rasb.
[proxmox]
pve ansible_host=10.99.0.100 ansible_user=ansible
pve2 ansible_host=192.168.1.181 ansible_user=ansible

# Pare-feu du SI, joint par son interface externe tant que wg1 n'existe pas
[pare_feu]
fw ansible_host=192.168.1.70 ansible_user=ansible

# VM du réseau interne, jointes par wg1 (ajoutées au fur et à mesure)
[interne]
idp ansible_host=10.10.0.5

# Cluster Kubernetes k3s (wiki : Kubernetes), sur le réseau interne : 3
# control-plane (etcd embarqué, tolère la perte d'un nœud) et 2 workers
[control_plane]
cp1 ansible_host=10.10.0.11
cp2 ansible_host=10.10.0.12
cp3 ansible_host=10.10.0.13

[workers]
w1 ansible_host=10.10.0.21
w2 ansible_host=10.10.0.22

[k3s:children]
control_plane
workers

[interne:children]
k3s

# Supervision, sur pve2 et le réseau local (wiki : Supervision) : jointe en
# direct par rasb, comme fw
[supervision]
sup ansible_host=192.168.1.71
