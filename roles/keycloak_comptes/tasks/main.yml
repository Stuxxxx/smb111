---
# Realm, groupes et comptes du SSO, décrits dans host_vars/idp/utilisateurs.yml.
# Aucun mot de passe ne passe par Ansible : chaque nouveau compte reçoit une
# invitation par e-mail pour choisir le sien et activer la double authentification.

- name: Chaque compte a une adresse e-mail dans le vault
  ansible.builtin.assert:
    that: kc_comptes_presents | map(attribute='nom') | difference(kc_emails.keys() | list) | length == 0
    fail_msg: >-
      Adresse e-mail manquante dans vault_keycloak_emails pour :
      {{ kc_comptes_presents | map(attribute='nom') | difference(kc_emails.keys() | list) | join(', ') }}
    quiet: true

# --- Compte d'automatisation -------------------------------------------------
- name: Le compte d'automatisation existe-t-il ?
  ansible.builtin.uri:
    url: "{{ kc_url }}/realms/master/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: password
      client_id: admin-cli
      username: "{{ kc_compte_ansible }}"
      password: "{{ kc_compte_ansible_mdp }}"
    validate_certs: false
    status_code: [200, 401]
  register: kc_test_ansible
  no_log: true

- name: Créer le compte d'automatisation (premier passage)
  when: kc_test_ansible.status == 401
  module_defaults:
    group/middleware_automation.keycloak.keycloak:
      auth_keycloak_url: "{{ kc_url }}"
      auth_realm: master
      auth_client_id: admin-cli
      auth_username: "{{ kc_compte_demarrage }}"
      auth_password: "{{ kc_compte_demarrage_mdp }}"
      validate_certs: false
  block:
    - name: Compte {{ kc_compte_ansible }} dans le realm master
      middleware_automation.keycloak.keycloak_user:
        realm: master
        username: "{{ kc_compte_ansible }}"
        enabled: true
        credentials:
          - type: password
            value: "{{ kc_compte_ansible_mdp }}"
            temporary: false
      no_log: true

    - name: Droits d'administration du compte {{ kc_compte_ansible }}
      middleware_automation.keycloak.keycloak_user_rolemapping:
        realm: master
        target_username: "{{ kc_compte_ansible }}"
        roles:
          - name: admin

# --- Realm, groupes, comptes -------------------------------------------------
- name: Configuration du SSO
  module_defaults:
    group/middleware_automation.keycloak.keycloak:
      auth_keycloak_url: "{{ kc_url }}"
      auth_realm: master
      auth_client_id: admin-cli
      auth_username: "{{ kc_compte_ansible }}"
      auth_password: "{{ kc_compte_ansible_mdp }}"
      validate_certs: false
  block:
    - name: Realm {{ kc_realm }}
      middleware_automation.keycloak.keycloak_realm:
        id: "{{ kc_realm }}"
        realm: "{{ kc_realm }}"
        display_name: "{{ kc_realm_nom_affiche }}"
        enabled: true
        registration_allowed: false       # pas d'inscription libre
        reset_password_allowed: true      # « mot de passe oublié », par e-mail
        password_policy: "{{ kc_politique_mdp }}"
        brute_force_protected: true
        failure_factor: "{{ kc_echecs_avant_blocage }}"
        permanent_lockout: false
        # Envoi par le relais de fw, sans authentification (réseau interne)
        smtp_server:
          host: "{{ mail_relais_interne }}"
          port: "25"
          from: "{{ mail_expediteur }}"
          fromDisplayName: "{{ mail_expediteur_nom }}"
          starttls: "false"
          ssl: "false"
          auth: "false"

    - name: Groupes
      middleware_automation.keycloak.keycloak_group:
        realm: "{{ kc_realm }}"
        name: "{{ item }}"
      loop: "{{ kc_groupes }}"

    - name: Le groupe {{ kc_groupe_admin }} administre le realm
      middleware_automation.keycloak.keycloak_client_rolemapping:
        realm: "{{ kc_realm }}"
        group_name: "{{ kc_groupe_admin }}"
        client_id: realm-management
        roles:
          - name: realm-admin

    - name: Comptes existants
      middleware_automation.keycloak.keycloak_realm_users_info:
        realm: "{{ kc_realm }}"
      register: kc_existants

    - name: Comptes déclarés
      middleware_automation.keycloak.keycloak_user:
        realm: "{{ kc_realm }}"
        username: "{{ item.nom }}"
        email: "{{ kc_emails[item.nom] }}"
        email_verified: true              # adresse fournie par un admin
        enabled: "{{ item.actif | default(true) }}"
        # Groupes : ceux de la liste, et retrait de tous les autres groupes gérés
        groups: >-
          {{ (item.groupes | default([]) | map('community.general.dict_kv', 'name') | list)
             + (kc_groupes | difference(item.groupes | default([]))
                | map('community.general.dict_kv', 'name')
                | map('combine', {'state': 'absent'}) | list) }}
      loop: "{{ kc_comptes_presents }}"
      loop_control:
        label: "{{ item.nom }}"
      register: kc_comptes

    # Nouveaux comptes, et ceux passés en -e renvoyer=nom1,nom2
    - name: Invitation par e-mail
      middleware_automation.keycloak.keycloak_user_execute_actions_email:
        realm: "{{ kc_realm }}"
        username: "{{ item.item.nom }}"
        actions: "{{ kc_actions_invitation }}"
        lifespan: "{{ kc_invitation_duree }}"
        client_id: account-console
        redirect_uri: "{{ keycloak_hostname }}/realms/{{ kc_realm }}/account/"
      loop: "{{ kc_comptes.results }}"
      loop_control:
        label: "{{ item.item.nom }}"
      when:
        - item.item.actif | default(true)
        - item.user_created | default(false) or item.item.nom in kc_renvoyer

    - name: Comptes supprimés
      middleware_automation.keycloak.keycloak_user:
        realm: "{{ kc_realm }}"
        username: "{{ item.nom }}"
        state: absent
      loop: "{{ keycloak_utilisateurs | selectattr('state', 'defined') | selectattr('state', 'equalto', 'absent') | list }}"
      loop_control:
        label: "{{ item.nom }}"

    - name: Supprimer le compte de démarrage {{ kc_compte_demarrage }}
      middleware_automation.keycloak.keycloak_user:
        realm: master
        username: "{{ kc_compte_demarrage }}"
        state: absent
      when: kc_supprimer_demarrage | bool
