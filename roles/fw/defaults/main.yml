---
# Interfaces : net0 (vmbr1, réseau interne) et net1 (vmbr0, réseau local)
fw_iface_interne: eth0
fw_iface_externe: eth1
fw_reseau_interne: "{{ reseau_interne }}.0/24"

# SSH accepté sur l'interface externe depuis ces seules adresses
fw_ssh_sources: ["{{ admin_ip_lan }}"]

# Lien d'administration wg1 : rasb y joint fw et les VM internes
fw_lien_iface: wg1
fw_lien_port: "{{ lien_admin_port }}"
fw_lien_admin: "{{ lien_admin_rasb }}"
# Ports des VM internes ouverts à rasb (SSH, API Kubernetes)
fw_lien_ports_internes: [22, 6443]
# Interfaces web ouvertes aux postes des administrateurs (wg0, relayés par rasb)
fw_lien_postes: "{{ reseau_wg0 }}"
fw_services_web_admin: "{{ services_web_admin }}"

# Supervision : seule exception au réseau local interdit, les agents des VM
# envoient métriques et journaux à sup (docs/supervision.md). "" = aucune.
fw_supervision_ip: "{{ supervision_ip | default('') }}"
fw_supervision_ports: "{{ [supervision_port_metriques, supervision_port_journaux] if supervision_ip is defined else [] }}"

# Destinations interdites aux VM : le réseau local (box, hyperviseur, postes).
# Seul Internet leur est accessible, via la NAT.
fw_destinations_interdites: ["192.168.1.0/24"]

# Journalisation des paquets rejetés (préfixe visible dans journalctl -k)
fw_log_rejets: true
fw_log_debit: "10/minute"

# Filet de sécurité : restauration automatique des règles précédentes si la
# connexion SSH est perdue après application.
fw_filet_minutes: 10

# DNS (dnsmasq, sans DHCP)
fw_dns_amont: ["1.1.1.1", "9.9.9.9"]
fw_dns_domaine: "{{ domaine_interne }}"
# Un enregistrement par VM déclarée dans vms.yml
fw_dns_hotes: "{{ vms | map(attribute='name') | zip(vms | map(attribute='ip')) | list }}"
# Domaines résolus par un serveur particulier : [{domaine, serveur}]
fw_dns_transferts: []
# Journal des requêtes DNS : désactivé par défaut (minimisation des données)
fw_dns_log_requetes: false

# Relais de messagerie (rôle relais_mail) : port 25 ouvert aux VM internes
fw_relais_mail: false
