---
# cert-manager : émet dans le cluster les certificats TLS signés par
# l'intermédiaire de la PKI du SI (wiki : PKI, Kubernetes).
cert_manager_version: v1.21.3
# Somme SHA-256 du manifeste officiel de cette version
cert_manager_sha256: c04a51295adda2b1a775146751f973e787190778c7f35180861d9678876e5c74
cert_manager_namespace: cert-manager

# Émetteur de tout le cluster : une Ingress l'utilise avec l'annotation
#   cert-manager.io/cluster-issuer: smb111
cert_manager_issuer: smb111
cert_manager_secret_ca: smb111-intermediaire

# Certificat de contrôle émis à chaque passage, pour prouver que la chaîne marche
cert_manager_test_dns: "verification-pki.{{ domaine_interne }}"
