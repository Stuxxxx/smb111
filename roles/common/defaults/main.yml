---
common_packages:
  - curl
  - vim
  - tmux
  - jq
  - git
  - bind9-dnsutils

fail2ban_maxretry: 3
fail2ban_bantime: 1h
fail2ban_findtime: 10m
fail2ban_ignoreip: "127.0.0.1/8 ::1"
# Mises à jour de sécurité automatiques
unattended_enabled: true
unattended_mail: ""            # adresse de notification, vide = aucune
unattended_autoclean_days: 7
# Paquets jamais mis à jour par unattended-upgrades (maintenance.yml les met à jour)
unattended_blacklist:
  - k3s
  - containerd
  - kubelet
# Locales à générer
common_locales:
  - en_US.UTF-8
  - fr_FR.UTF-8
