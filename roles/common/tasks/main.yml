---
- name: Paquets de base
  ansible.builtin.apt:
    name: "{{ common_packages + ['fail2ban'] }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Durcissement SSH
  ansible.builtin.template:
    src: 00-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: restart sshd

- name: Configuration de fail2ban
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: restart fail2ban

- name: fail2ban démarré et activé au démarrage
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
