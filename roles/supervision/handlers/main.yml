---
- name: restart nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded

- name: restart docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted

- name: restart chrony
  ansible.builtin.systemd_service:
    name: chrony
    state: restarted

- name: restart prometheus
  community.docker.docker_compose_v2:
    project_src: "{{ supervision_dir }}"
    services: [prometheus]
    state: restarted

- name: restart alertmanager
  community.docker.docker_compose_v2:
    project_src: "{{ supervision_dir }}"
    services: [alertmanager]
    state: restarted

- name: restart loki
  community.docker.docker_compose_v2:
    project_src: "{{ supervision_dir }}"
    services: [loki]
    state: restarted

- name: restart grafana
  community.docker.docker_compose_v2:
    project_src: "{{ supervision_dir }}"
    services: [grafana]
    state: restarted

- name: restart nginx
  community.docker.docker_compose_v2:
    project_src: "{{ supervision_dir }}"
    services: [nginx]
    state: restarted
  listen: certificat renouvelé
