---
# Version installée : vérifier la dernière sur
# https://github.com/keycloak/keycloak/releases
keycloak_version: "26.4.0"
keycloak_java_package: openjdk-21-jre-headless

# URL publique, telle que la verront les navigateurs et les services.
# Elle est inscrite dans chaque jeton (champ « iss ») : la changer plus tard
# oblige à reconfigurer tous les services branchés sur le SSO.
keycloak_hostname: "https://idp.{{ domaine_interne }}"
keycloak_https_port: 443

keycloak_user: keycloak
keycloak_install_dir: /opt
keycloak_home: /opt/keycloak          # lien vers la version active
keycloak_conf_dir: /etc/keycloak

# Mémoire de la JVM : la VM n'a que 1,5 Gio, partagés avec PostgreSQL et le système
keycloak_java_heap: "-XX:MaxRAMPercentage=40 -XX:InitialRAMPercentage=20"

# Base de données locale
keycloak_db_name: keycloak
keycloak_db_user: keycloak
keycloak_db_password: "{{ vault_keycloak_db_password }}"

# Administrateur temporaire, créé au premier démarrage seulement
keycloak_admin_user: admin-temp
keycloak_admin_password: "{{ vault_keycloak_admin_password }}"

# Certificat TLS émis par la PKI du SI (rôle certificat, docs/pki.md).
# localhost : les appels d'administration faits depuis idp elle-même.
# keycloak_cert_autosigne: true revient à un certificat autosigné (dépannage).
keycloak_cert_autosigne: false
keycloak_cert_nom: idp
keycloak_cert_dns:
  - "{{ keycloak_hostname | urlsplit('hostname') }}"
  - localhost
keycloak_cert_file: >-
  {{ keycloak_conf_dir ~ '/tls.crt' if keycloak_cert_autosigne | bool
     else pki_certificats_dir ~ '/' ~ keycloak_cert_nom ~ '-chaine.crt' }}
keycloak_key_file: >-
  {{ keycloak_conf_dir ~ '/tls.key' if keycloak_cert_autosigne | bool
     else pki_certificats_dir ~ '/' ~ keycloak_cert_nom ~ '.key' }}
