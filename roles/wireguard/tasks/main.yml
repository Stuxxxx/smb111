---
- name: Paquet wireguard
  ansible.builtin.apt:
    name: wireguard-tools
    state: present
  when: wg_enabled | bool

- name: Routage IP activé
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_file: /etc/sysctl.d/99-smb111.conf
    sysctl_set: true
    reload: true
    state: present
  when:
    - wg_enabled | bool
    - wg_route_lan | bool

- name: Configuration du tunnel
  ansible.builtin.template:
    src: wg.conf.j2
    dest: "/etc/wireguard/{{ wg_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  when: wg_enabled | bool
  no_log: true
  notify: restart wireguard

- name: Service wg-quick
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ wg_interface }}"
    state: "{{ 'started' if wg_enabled | bool else 'stopped' }}"
    enabled: "{{ wg_enabled | bool }}"
    daemon_reload: true
  when: not ansible_check_mode

- name: Paquet nftables
  ansible.builtin.apt:
    name: nftables
    state: present
  when: wg_enabled | bool

- name: Répertoire des règles nftables
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0750"
  when: wg_enabled | bool

- name: Règles de relais entre pairs
  ansible.builtin.template:
    src: wg-forward.conf.j2
    dest: /etc/nftables.d/wg-forward.conf
    owner: root
    group: root
    mode: "0640"
    validate: /usr/sbin/nft -c -f %s
  when: wg_enabled | bool
  notify: recharger les relais

- name: Service de relais
  ansible.builtin.copy:
    dest: /etc/systemd/system/wg-forward.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Relais entre pairs du tunnel WireGuard
      After=wg-quick@{{ wg_interface }}.service
      Requires=wg-quick@{{ wg_interface }}.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/sbin/nft -f /etc/nftables.d/wg-forward.conf
      ExecStop=/usr/sbin/nft delete table ip wgfwd

      [Install]
      WantedBy=multi-user.target
  when: wg_enabled | bool
  notify: recharger les relais

- name: Activer le relais
  ansible.builtin.systemd_service:
    name: wg-forward
    state: started
    enabled: true
    daemon_reload: true
  when:
    - wg_enabled | bool
    - not ansible_check_mode
