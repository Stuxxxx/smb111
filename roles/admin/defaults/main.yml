---
admin_repo_url: "https://github.com/Stuxxxx/smb111.git"
admin_repo_branch: main
admin_pull_playbook: site.yml
admin_pull_interval: "10min"
admin_pull_user: sacha

# Convergence automatique désactivée par défaut : elle est activée
# machine par machine, dans host_vars/.
admin_pull_enabled: false

# Maintenance planifiée
admin_maintenance_enabled: false
admin_maintenance_schedule: "Sun *-*-* 03:00:00"
# Installation partagée d'Ansible
admin_ansible_bin: /usr/local/bin
admin_pipx_home: /opt/pipx
admin_collections_path: /usr/share/ansible/collections
# Clé SSH des machines (compte ansible), partagée par le groupe admins
admin_cle_projet: /etc/ansible/smb111

# Contrôle de conformité
admin_check_enabled: false
admin_check_schedule: "*-*-* 06:00:00"
admin_rapports_dir: /var/log/smb111

# Sauvegarde de l'état persistant (playbooks/sauvegarde.yml), avant la maintenance
admin_sauvegarde_enabled: false
admin_sauvegarde_schedule: "*-*-* 02:00:00"

# Copie du dépôt réservée aux tâches programmées : réalignée sur
# admin_repo_branch avant chaque exécution, jamais modifiée à la main.
# Les clones personnels (~/smb111) restent libres d'être sur une autre branche.
admin_depot_auto: /var/lib/smb111/depot

# Notifications par e-mail des administrateurs, envoyées directement par le
# service d'envoi (group_vars/all/mail.yml) : elles partent même si pve ou fw
# sont arrêtés. Destinataires : notification_destinataires.
admin_notifications_enabled: true
admin_notifier: /usr/local/bin/smb111-notifier
admin_notifier_echec: /usr/local/bin/smb111-notifier-echec
admin_notification_destinataires: /etc/smb111/destinataires
