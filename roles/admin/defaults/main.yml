---
admin_repo_url: "https://github.com/Stuxxxx/smb111.git"
admin_repo_branch: main
admin_pull_playbook: site.yml
admin_pull_interval: "10min"
admin_pull_user: sacha

# Convergence automatique désactivée par défaut : elle est activée
# machine par machine, dans host_vars/.
admin_pull_enabled: false

# Maintenance planifiée
admin_maintenance_enabled: false
admin_maintenance_schedule: "Sun *-*-* 03:00:00"
# Installation partagée d'Ansible
admin_ansible_bin: /usr/local/bin
admin_pipx_home: /opt/pipx
admin_collections_path: /usr/share/ansible/collections
