---
- name: Service ansible-pull
  ansible.builtin.template:
    src: ansible-pull.service.j2
    dest: /etc/systemd/system/ansible-pull.service
    owner: root
    group: root
    mode: "0644"

- name: Timer ansible-pull
  ansible.builtin.template:
    src: ansible-pull.timer.j2
    dest: /etc/systemd/system/ansible-pull.timer
    owner: root
    group: root
    mode: "0644"

- name: Activer ou désactiver le timer selon admin_pull_enabled
  ansible.builtin.systemd_service:
    name: ansible-pull.timer
    state: "{{ 'started' if admin_pull_enabled else 'stopped' }}"
    enabled: "{{ admin_pull_enabled }}"
    daemon_reload: true
