---
- name: Installation partagée d'Ansible
  ansible.builtin.import_tasks: ansible.yml

- name: Notifications par e-mail des administrateurs
  ansible.builtin.import_tasks: notifications.yml
  when: admin_notifications_enabled | bool

# Les tâches programmées n'utilisent pas un clone personnel, qui peut être sur
# une branche en cours : elles ont le leur, réaligné sur la branche de
# référence avant chaque exécution (ExecStartPre des services).
- name: Répertoire de la copie automatique du dépôt
  ansible.builtin.file:
    path: "{{ admin_depot_auto | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Dossier de la copie automatique, au compte qui exécute les tâches
  ansible.builtin.file:
    path: "{{ admin_depot_auto }}"
    state: directory
    owner: "{{ admin_pull_user }}"
    group: "{{ admin_pull_user }}"
    mode: "0755"

- name: Copie du dépôt pour les tâches programmées
  ansible.builtin.git:
    repo: "{{ admin_repo_url }}"
    dest: "{{ admin_depot_auto }}"
    version: "{{ admin_repo_branch }}"
    force: true
  become: true
  become_user: "{{ admin_pull_user }}"
  when: admin_maintenance_enabled or admin_check_enabled or admin_sauvegarde_enabled

- name: Commandes d'extinction des hyperviseurs et d'encadrement des tâches programmées
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: admins
    mode: "0750"
  loop:
    - { src: extinction-pve.j2, dest: "{{ admin_extinction_commande }}" }
    - { src: smb111-avec-pve.j2, dest: "{{ admin_avec_pve }}" }
  loop_control:
    label: "{{ item.dest }}"
  when: admin_reveil_hyperviseur | bool

- name: Service ansible-pull
  ansible.builtin.template:
    src: ansible-pull.service.j2
    dest: /etc/systemd/system/ansible-pull.service
    owner: root
    group: root
    mode: "0644"

- name: Timer ansible-pull
  ansible.builtin.template:
    src: ansible-pull.timer.j2
    dest: /etc/systemd/system/ansible-pull.timer
    owner: root
    group: root
    mode: "0644"

- name: Activer ou désactiver le timer selon admin_pull_enabled
  ansible.builtin.systemd_service:
    name: ansible-pull.timer
    state: "{{ 'started' if admin_pull_enabled else 'stopped' }}"
    enabled: "{{ admin_pull_enabled }}"
    daemon_reload: true

- name: Répertoire /etc/ansible
  ansible.builtin.file:
    path: /etc/ansible
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Mot de passe du vault, lisible par le groupe admins
  ansible.builtin.copy:
    content: "{{ vault_password }}\n"
    dest: /etc/ansible/vault_pass
    owner: root
    group: admins
    mode: "0640"
  no_log: true
  when: vault_password is defined

- name: Service de maintenance
  ansible.builtin.template:
    src: maintenance.service.j2
    dest: /etc/systemd/system/maintenance.service
    owner: root
    group: root
    mode: "0644"

- name: Timer de maintenance
  ansible.builtin.template:
    src: maintenance.timer.j2
    dest: /etc/systemd/system/maintenance.timer
    owner: root
    group: root
    mode: "0644"

- name: Activer ou désactiver le timer de maintenance
  ansible.builtin.systemd_service:
    name: maintenance.timer
    state: "{{ 'started' if admin_maintenance_enabled else 'stopped' }}"
    enabled: "{{ admin_maintenance_enabled }}"
    daemon_reload: true

- name: Service de sauvegarde
  ansible.builtin.template:
    src: sauvegarde.service.j2
    dest: /etc/systemd/system/sauvegarde.service
    owner: root
    group: root
    mode: "0644"

- name: Timer de sauvegarde
  ansible.builtin.template:
    src: sauvegarde.timer.j2
    dest: /etc/systemd/system/sauvegarde.timer
    owner: root
    group: root
    mode: "0644"

# En --check, l'unité n'est pas réellement écrite : systemd ne la connaît pas encore
- name: Activer ou désactiver le timer de sauvegarde
  ansible.builtin.systemd_service:
    name: sauvegarde.timer
    state: "{{ 'started' if admin_sauvegarde_enabled else 'stopped' }}"
    enabled: "{{ admin_sauvegarde_enabled }}"
    daemon_reload: true
  when: not ansible_check_mode

# setgid : les sauvegardes déposées par un admin restent au groupe admins
- name: Dossier des sauvegardes
  ansible.builtin.file:
    path: "{{ sauvegarde_dir }}"
    state: directory
    owner: root
    group: admins
    mode: "2770"

- name: Dossier des rapports de contrôle
  ansible.builtin.file:
    path: "{{ admin_rapports_dir }}"
    state: directory
    owner: root
    group: admins
    mode: "0770"

- name: Service de contrôle
  ansible.builtin.template:
    src: check.service.j2
    dest: /etc/systemd/system/check.service
    owner: root
    group: root
    mode: "0644"

- name: Timer de contrôle
  ansible.builtin.template:
    src: check.timer.j2
    dest: /etc/systemd/system/check.timer
    owner: root
    group: root
    mode: "0644"

- name: Activer ou désactiver le timer de contrôle
  ansible.builtin.systemd_service:
    name: check.timer
    state: "{{ 'started' if admin_check_enabled else 'stopped' }}"
    enabled: "{{ admin_check_enabled }}"
    daemon_reload: true

- name: Commande du contrôle de veille de la supervision
  ansible.builtin.template:
    src: smb111-veille-supervision.j2
    dest: "{{ admin_veille_commande }}"
    owner: root
    group: admins
    mode: "0750"
  when: admin_veille_supervision_enabled | bool

- name: Service et timer du contrôle de veille de la supervision
  ansible.builtin.template:
    src: "veille-supervision.{{ item }}.j2"
    dest: "/etc/systemd/system/veille-supervision.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [service, timer]

- name: Activer ou désactiver le contrôle de veille de la supervision
  ansible.builtin.systemd_service:
    name: veille-supervision.timer
    state: "{{ 'started' if admin_veille_supervision_enabled else 'stopped' }}"
    enabled: "{{ admin_veille_supervision_enabled }}"
    daemon_reload: true
  when: not ansible_check_mode

# Clé des machines, partagée par les administrateurs comme le mot de passe du
# vault (qui la contient déjà) : chacun lance les playbooks sous son propre
# compte. Appartenant à root, ssh l'accepte malgré la lecture par le groupe.
- name: Clé SSH du projet, lisible par le groupe admins
  ansible.builtin.copy:
    content: "{{ vault_smb111_private_key }}"
    dest: "{{ admin_cle_projet }}"
    owner: root
    group: admins
    mode: "0640"
  no_log: true
  when: vault_smb111_private_key is defined

# Calculée depuis le vault et non depuis le fichier : root, propriétaire du
# fichier, se le verrait refuser par ssh-keygen (droits 0640 trop ouverts).
- name: Calculer la partie publique de la clé du projet
  ansible.builtin.command: ssh-keygen -y -f /dev/stdin
  args:
    stdin: "{{ vault_smb111_private_key }}"
  register: admin_cle_publique
  changed_when: false
  no_log: true
  when: vault_smb111_private_key is defined

- name: Partie publique de la clé du projet
  ansible.builtin.copy:
    content: "{{ admin_cle_publique.stdout }}\n"
    dest: "{{ admin_cle_projet }}.pub"
    owner: root
    group: root
    mode: "0644"
  when: vault_smb111_private_key is defined
